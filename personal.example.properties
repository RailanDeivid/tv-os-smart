# Copy this file to personal.properties (which git ignores) and fill it in.
# Everything here is optional: a feature whose settings are empty is simply left out of the app.
# Passwords never go here. Camera accounts are typed on the TV (Menu on the camera screen).

# football-data.org API token (free plan: https://www.football-data.org/client/register).
football_api_key=

# Clubs to follow, up to two, separated by semicolons:
#   key|name shown|football-data.org team id|competition codes
# Example team ids: Real Madrid 86, FC Barcelona 81. Codes the free plan covers include PD, CL, BSA, PL.
teams=rm|Real Madrid CF|86|PD,CL;fc|FC Barcelona|81|PD,CL

# How club names are written: short (Barça, Racing: default), full (Real Racing Club de Santander) or tla (RAC).
team_names=short

# Where the 10-day forecast is for (Open-Meteo, no key needed).
weather_lat=-23.5505
weather_lon=-46.6333
weather_city=São Paulo

# Ambient mode: minutes with no key pressed on the home screen before it shows only the clock, matches and
# forecast. 0 turns it off; empty means 5.
ambient_minutes=5

# Apps to keep out of the home screen grid, comma separated by package name. Useful for a TV app that must stay
# installed (it is what switches HDMI inputs) but is not worth a tile. Example for this kind of TV:
# hidden_apps=com.mediatek.wwtv.tvcenter
hidden_apps=

# Remote-button shortcuts that work in every app. They need the "Key shortcuts" accessibility service turned on
# (see the README). A button is KEYCODE_NAME, a number, or scan:NNN; list several with commas; put long: in front
# of one to react to holding it.
# Both are optional; empty means no shortcut. Example: key_cameras=long:KEYCODE_MENU  key_home=KEYCODE_TV_INPUT
key_cameras=
key_home=

# Cameras (RTSP), separated by semicolons:
#   key|name|host|path|default user|lenses|mosaic path
# key     short id the saved account is stored under; keep it stable if you reorder the list
# lenses  empty for a normal camera, or "Name 1,Name 2" for a dual-lens camera whose single picture
#         holds both lenses stacked, top and bottom
# mosaic path  optional lighter stream used in the mosaic (Tapo: /stream2); empty means the same as path
cameras=front|Front|192.168.1.50|/stream1|||/stream2;garden|Garden|192.168.1.51|/onvif2|admin|Lens 1,Lens 2
